name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor and the current release. requires-python is >=3.12, and
        # the runtime leans on 3.12+ typing syntax throughout, so the floor is
        # the version that can actually break. Running only the newest would
        # let a 3.13-only construct land and quietly raise the real floor.
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        # --locked, not --frozen: a lockfile that has drifted from
        # pyproject.toml should fail here rather than be silently regenerated
        # into something nobody reviewed.
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Test
        run: uv run pytest

      - name: Lint
        # conformance/ is linted here even though it cannot be *run* here:
        # linting is static and needs none of the contract artifacts, so
        # there is no reason to let it rot while the run is blocked.
        run: uv run ruff check src tests conformance

      - name: Typecheck
        run: uv run mypy src/paa_runtime

  # The base install has to work for someone who clones only this repo. That
  # is not hypothetical: an earlier revision of the conformance extra pinned
  # paa-contracts to a sibling site checkout, and because uv resolves metadata
  # for every locked entry regardless of which extras are requested, plain
  # `uv sync` failed for everyone who did not have the site repo next door.
  # The unit tests above all passed while that was true, because the developer
  # machine that ran them had the sibling.
  clean-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v5

      - name: Install from the lockfile with nothing else present
        run: uv sync --locked

      - name: Import the package from a built wheel
        # Built and installed as a wheel, not run from src/, so a packaging
        # mistake — a module left out of the wheel, a data file assumed
        # present — fails here instead of at a consumer's first import.
        #
        # --no-cache is load-bearing. uv keys its unpacked-wheel cache on the
        # distribution filename, which does not change when a wheel is rebuilt
        # at the same version, so a warm cache can serve a previous build to
        # this step. Caught exactly that way locally: a wheel that genuinely
        # contained py.typed was reported as missing it, because the install
        # resolved to a cached unpack from before the file was added.
        run: |
          uv build --wheel
          uv run --isolated --no-project --no-cache --with dist/*.whl python -c "
          import paa_runtime
          from paa_runtime import RuntimeConfig, SqliteEventStore, propose, approve, show
          print('paa_runtime', paa_runtime.__file__)
          "

  # The conformance suite itself now exists and passes — see conformance/ and
  # the README's Conformance section. What is still missing is a way for *this*
  # repo's runner to obtain the contract artifacts.
  #
  # paa-contracts is not on PyPI, and paa_site — the repo it is released from —
  # is private, so an anonymous runner here can reach it by neither route.
  # GITHUB_TOKEN cannot help: it is scoped to this repository alone. Enabling a
  # job here therefore needs one of:
  #
  #   1. paa-contracts published to PyPI. The job then reduces to
  #      `uv sync --locked --extra conformance` and `uv run pytest conformance`,
  #      and paa-contracts joins the extra in pyproject.toml; or
  #   2. a cross-repo read credential for paa_site in this repo's secrets, used
  #      as `uv run --with "paa-contracts @ git+https://...@github.com/..."`.
  #
  # Neither is a decision this file should make quietly, so it is left to the
  # operator rather than committed half-configured.
  #
  # The other direction already works anonymously, because paa-runtime is
  # public and the site's runner has the artifacts on disk: a cross-check job
  # in the site repo that checks this repo out and runs `pytest conformance`
  # against the site's own working tree. That is what the extraction spec asks
  # for — a schema change that breaks the implementation should break the site
  # build at the source — and it is the site-side follow-up in spec step 5.
  #
  # Deliberately not written as a skipping job. A test that skips by default is
  # a test that is off, and this repo already decided that once — see the
  # schema-harness swap in the extraction spec.
