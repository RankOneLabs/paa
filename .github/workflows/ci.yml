name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor and the current release. requires-python is >=3.12, and
        # the runtime leans on 3.12+ typing syntax throughout, so the floor is
        # the version that can actually break. Running only the newest would
        # let a 3.13-only construct land and quietly raise the real floor.
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        # --locked, not --frozen: a lockfile that has drifted from
        # pyproject.toml should fail here rather than be silently regenerated
        # into something nobody reviewed.
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Test
        run: uv run pytest

      - name: Lint
        # conformance/ is linted here even though it cannot be *run* here:
        # linting is static and needs none of the contract artifacts, so
        # there is no reason to let it rot while the run is blocked.
        run: uv run ruff check src tests conformance packages

      - name: Typecheck
        run: uv run mypy src/paa_runtime

  # The base install has to work for someone who clones only this repo. That
  # is not hypothetical: an earlier revision of the conformance extra pinned
  # paa-contracts to a sibling site checkout, and because uv resolves metadata
  # for every locked entry regardless of which extras are requested, plain
  # `uv sync` failed for everyone who did not have the site repo next door.
  # The unit tests above all passed while that was true, because the developer
  # machine that ran them had the sibling.
  clean-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v5

      - name: Install from the lockfile with nothing else present
        run: uv sync --locked

      - name: Import the package from a built wheel
        # Built and installed as a wheel, not run from src/, so a packaging
        # mistake — a module left out of the wheel, a data file assumed
        # present — fails here instead of at a consumer's first import.
        #
        # --no-cache is load-bearing. uv keys its unpacked-wheel cache on the
        # distribution filename, which does not change when a wheel is rebuilt
        # at the same version, so a warm cache can serve a previous build to
        # this step. Caught exactly that way locally: a wheel that genuinely
        # contained py.typed was reported as missing it, because the install
        # resolved to a cached unpack from before the file was added.
        run: |
          uv build --wheel
          uv run --isolated --no-project --no-cache --with dist/*.whl python -c "
          import paa_runtime
          from paa_runtime import RuntimeConfig, SqliteEventStore, propose, approve, show
          print('paa_runtime', paa_runtime.__file__)
          "

  # Conformance runs against the published contract artifacts, which now live
  # in this repo alongside the implementation they measure. This job existed as
  # a comment for one release explaining why it could not be written: the
  # artifacts were in a separate private repo, paa-contracts was not on PyPI,
  # and GITHUB_TOKEN is scoped to this repository alone. Moving the contract
  # here dissolved all three at once rather than solving any of them.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install with the conformance extra
        run: uv sync --locked --extra conformance

      - name: Conformance
        # The path argument is required: testpaths is `tests`, so a bare pytest
        # runs the unit suite and nothing else. Opt-in by invocation, never by
        # skip marker — paa_contracts raises at import when the artifacts are
        # absent, so this fails loudly rather than reporting green over an
        # empty corpus.
        run: uv run pytest conformance

      - name: Contract package tests
        # Includes registry coverage: SCHEMA_IDS against the schemas actually
        # on disk, and the build hook against the directories the accessors
        # read. Both catch a contract added to the corpus and forgotten in a
        # list — which the cross-repo parity check this replaced could not,
        # since two lists forgetting it equally agreed with each other.
        run: uv run --package paa-contracts pytest packages/paa-contracts/tests

      - name: Prove the contract wheel carries the artifacts verbatim
        # A workspace member installs editable, so everything above reads the
        # working tree and would pass just as happily if the build shipped an
        # empty package. This is the check that a release would actually carry
        # the corpus: wheel against tree, both directions, byte for byte.
        run: |
          uv build --package paa-contracts
          uv run --no-cache python packages/paa-contracts/scripts/verify_built_wheel.py dist/paa_contracts-*.whl
