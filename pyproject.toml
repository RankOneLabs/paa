[project]
name = "paa-runtime"
version = "0.2.0"
description = "Reference implementation of the Progressive Autonomy Architecture control plane: task declarations, motion lifecycle, position resolution, content-addressed evidence, and an append-only autonomy event store"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rank One Labs" }]
keywords = [
    "paa",
    "progressive-autonomy-architecture",
    "autonomy",
    "governance",
    "event-sourcing",
    "audit",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://www.paa.dev"
Documentation = "https://www.paa.dev/reference/schema"
Repository = "https://github.com/RankOneLabs/paa-runtime"

[project.optional-dependencies]
# Conformance runs against the published contract artifacts. paa-contracts
# carries the schemas, the positive fixture corpus, and the invalid-case
# tables, released from the paa.dev repo. Nothing in paa_runtime loads a JSON
# schema at runtime — declarations.py explicitly declines to re-implement the
# external schema — so this stays test-only and never enters a production
# install.
conformance = [
    "jsonschema>=4.23",
]

# paa-contracts is missing from that list on purpose, and it is the other half
# of what conformance needs — the schemas, the positive fixture corpus, and
# the invalid-case tables.
#
# It is not on PyPI yet, and an unresolvable requirement cannot be locked. A
# [tool.uv.sources] path entry to a sibling site checkout does lock, but uv
# resolves metadata for every locked entry regardless of which extras are
# requested, so plain `uv sync` then fails for anyone who does not happen to
# have the site repo next door. Breaking the base install of a package whose
# whole pitch is that it installs anywhere is a far worse trade than an extra
# that is briefly incomplete.
#
# Until it ships, bring it in per-command — this builds and installs a real
# wheel, so it exercises the packaged data path the release actually uses:
#
#     uv run --with ../paadotdev/packages/paa-contracts pytest
#
# On publication it joins the list above as `paa-contracts>=0.1.0` and this
# comment goes away.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paa_runtime"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0.12.20260518",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["paa_runtime"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = ["tests/", "conformance/"]

[[tool.mypy.overrides]]
module = ["yaml", "jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
