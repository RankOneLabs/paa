[project]
name = "paa-runtime"
version = "0.4.0"
description = "Reference implementation of the Progressive Autonomy Architecture control plane: task declarations, motion lifecycle, position resolution, content-addressed evidence, and an append-only autonomy event store"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rank One Labs" }]
keywords = [
    "paa",
    "progressive-autonomy-architecture",
    "autonomy",
    "governance",
    "event-sourcing",
    "audit",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://www.paa.dev"
Documentation = "https://www.paa.dev/reference/schema"
Repository = "https://github.com/RankOneLabs/paa"

[project.optional-dependencies]
# Conformance runs against the published contract artifacts: the five schemas,
# the positive fixture corpus, and the invalid-case tables, all carried by
# paa-contracts.
#
# paa-contracts can finally be named here. It used to be conspicuously absent
# — it lived in a separate private repo, an unresolvable requirement cannot be
# locked, and a path entry to a sibling checkout broke plain `uv sync` for
# anyone without that checkout, because uv resolves metadata for every locked
# entry regardless of which extras are requested. Every part of that problem
# was an artifact of where the contract sat, and moving it into this repo
# dissolved all of it: a workspace member resolves for everyone with a
# checkout, which is everyone who can run the suite at all.
#
# Still test-only. Nothing in paa_runtime loads a JSON schema at runtime —
# declarations.py explicitly declines to re-implement the external schema — so
# a production install pulls neither of these.
#
# The `format-nongpl` extra is load-bearing, not decoration. JSON Schema
# makes `format` an annotation by default, and jsonschema only asserts it
# when a FormatChecker is supplied *and* the per-format validators are
# installed — without them a FormatChecker silently checks nothing, and
# the three published cases that mutate a date-time into "not-a-date"
# pass validation. `nongpl` rather than `format`: the latter pulls
# rfc3987, which is GPL, and this repo is MIT.
conformance = [
    "jsonschema[format-nongpl]>=4.23",
    "paa-contracts>=0.2.0",
]

# One repo, two published packages. The contract is data with no dependencies
# and no implementation; the runtime is one implementation of it. They version
# and release independently, and a consumer who wants only the contract must
# be able to take it without dragging a Python implementation along — that is
# what makes implementation-neutrality structural rather than asserted.
[tool.uv.workspace]
members = ["packages/paa-contracts"]

[tool.uv.sources]
paa-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paa_runtime"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0.12.20260518",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["paa_runtime"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = ["tests/", "conformance/"]

[[tool.mypy.overrides]]
module = ["yaml", "jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
